# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
build:
  environment: nodejs  
  runtime: nodejs20  
  buildCommand: npm ci && npm run build  

runConfig:
  minInstances: 0

env:
  - variable: REACT_APP_FIREBASE_API_KEY
    secret: FIREBASE_API_KEY # Your Secret Manager name
  - variable: REACT_APP_FIREBASE_AUTH_DOMAIN
    secret: FIREBASE_AUTH_DOMAIN # Or use value: "champlife-v3.firebaseapp.com" if non-sensitive
  - variable: REACT_APP_FIREBASE_PROJECT_ID
    value: "champlife-v3" # Safe as value since it's public
  - variable: REACT_APP_FIREBASE_STORAGE_BUCKET
    secret: FIREBASE_STORAGE_BUCKET
  - variable: REACT_APP_FIREBASE_MESSAGING_SENDER_ID
    secret: FIREBASE_MESSAGING_SENDER_ID
  - variable: REACT_APP_FIREBASE_APP_ID
    secret: FIREBASE_APP_ID
  - variable: REACT_APP_FIREBASE_MEASUREMENT_ID
    secret: FIREBASE_MEASUREMENT_ID # Optional
  - variable: APP_MEASUREMENT_ID
    secret: FIREBASE_MEASUREMENT_ID
  # Grant access to secrets in Cloud Secret Manager.
  # See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
  # - variable: MY_SECRET
  #   secret: mySecretRef
